# SysCenter 部署编排（规格书 §9/§10：Docker 仅负责基础设施）
#
# 职责边界（EXE 原生化后）：
#   - 后端（FastAPI）+ 前端（Web UI）由 SysCenter.exe 在本机直接运行并对外提供（默认 8352），
#     不再以容器承载，也不再需要 nginx 反代（2026-08-20 已移除 frontend 服务）。
#   - Docker 只提供 PostgreSQL + Redis 两个支撑服务（固定数据卷 / 健康检查 / 自动重启）。
#     这两个容器是 SysCenter.exe 的地基，必须保持运行。
#
# 注意：前端端口统一为 8372（与 README / CORS / Cloudflare Tunnel 一致，P2-05）。
# 密码来源：全部来自 .env（PG_PASSWORD / REDIS 口令），绝不硬编码（规格书 §33）。
services:
  postgres:
    image: postgres:16-alpine
    container_name: syscenter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-syscenter}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-syscenter_pass_2026}
      POSTGRES_DB: ${PG_DATABASE:-syscenter}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${PG_PORT:-5442}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-syscenter} -d ${PG_DATABASE:-syscenter}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [syscenter-net]

  redis:
    image: redis:7-alpine
    container_name: syscenter-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6387}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [syscenter-net]

networks:
  syscenter-net:
    name: syscenter-net

volumes:
  pgdata:
  redisdata:
