server {
    listen 80;
    server_name syscenter.yshost.de5.net localhost 127.0.0.1;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩（参考本机项目前端提速经验）
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_comp_level 5;

    # 静态资源缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # API 反代到本机后端（Docker Desktop 的 host.docker.internal = 宿主机）
    location /api/ {
        proxy_pass http://host.docker.internal:8352;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # SPA 兜底（index.html 禁止缓存，确保每次前端构建后浏览器取到最新的包引用，
    # 避免旧 index.html 指向已被清掉的旧包导致白屏/"点击无反应"）
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
